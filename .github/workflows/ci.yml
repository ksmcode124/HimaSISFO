name: CI

on:
  pull_request:
    branches: [main, dev, new-FE, new-BE]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Validate & Generate Prisma
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: |
          npx prisma validate
          npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          BETTER_AUTH_SECRET: "ci-dummy-secret-at-least-32-chars-long"
          BETTER_AUTH_URL: "http://localhost:3000"
        run: npm run build
